<html lang="es">
<head>

<meta property="og:description" content="Toca el sobre para abrir tu invitación">

<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--script:'Allura',cursive;--acento:#8a6d47;--arena:#d9c7ad;--tinta:#2b241d;--gris:#ece5d8;--crema:#faf6ef;--papel:#fffdf8;--trigo:#bfa27a;--cafe:#6b5236;--sh:122,94,60}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;background:var(--crema);color:var(--tinta);font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;font-weight:500;text-align:center;overflow-x:hidden}
html.lock,body.lock{overflow:hidden;height:100%;touch-action:none}
.wrap{max-width:480px;margin:0 auto;padding:0 var(--pad,22px);position:relative;z-index:2}
.script{font-family:var(--script);font-weight:400}
h2.script{font-size:3.4rem;line-height:1.1;margin:8px 0 18px;text-shadow:0 1px 0 #fffc,0 5px 12px rgba(var(--sh),.28)}
img{max-width:100%;display:block}
.ph{background:var(--gris);min-height:140px;border:1px dashed #cdbfa8}
:focus-visible{outline:2px solid var(--acento);outline-offset:3px}
.nota{font-style:italic;color:#7a5c36;border-bottom:1px dashed #a8905f}

/* ===== fondo con detalle ===== */
#fondo{position:fixed;top:0;left:0;width:100%;height:170vh;will-change:transform;z-index:-2;background-image:radial-gradient(circle at 8% 6%,#f1e5d1 0,transparent 30%),radial-gradient(circle at 96% 30%,#efe0c6 0,transparent 32%),radial-gradient(circle at 6% 62%,#f4eadb 0,transparent 30%),radial-gradient(circle at 92% 78%,#e9d8bd 0,transparent 30%),radial-gradient(circle at 20% 98%,#ecdfc8 0,transparent 32%),radial-gradient(circle at 60% 50%,#f7efe0 0,transparent 40%);}
#grano{position:fixed;top:0;right:0;bottom:0;left:0;transform:translateZ(0);z-index:-1;opacity:.38;pointer-events:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .36 0 0 0 0 .25 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#marco{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));left:calc(10px + env(safe-area-inset-left,0px));border:1px solid #8a6d4766;outline:1px solid #8a6d4738;outline-offset:-6px;pointer-events:none;z-index:15;opacity:0;transition:opacity 1.5s 1s}
body:not(.lock) #marco,#marco.v{opacity:1}
.rama{filter:drop-shadow(0 4px 6px rgba(var(--sh),.25));position:fixed;top:14vh;width:54px;height:62vh;opacity:.4;z-index:1;pointer-events:none;transform-origin:50% 100%;animation:sway 8s ease-in-out infinite}
.rama.i{left:-16px}.rama.d{right:-16px;--f:-1;animation-delay:-4s}
@keyframes sway{0%,100%{transform:scaleX(var(--f,1)) rotate(-2.5deg)}50%{transform:scaleX(var(--f,1)) rotate(2.5deg)}}
#petalos{position:fixed;top:0;right:0;bottom:0;left:0;z-index:1;pointer-events:none;overflow:hidden;contain:layout paint;transform:translateZ(0)}
.pet{will-change:transform,opacity;box-shadow:0 2px 4px rgba(var(--sh),.22);position:absolute;top:-30px;border-radius:100% 0 100% 0;opacity:0;animation:caer linear infinite}
@keyframes caer{0%{opacity:0;transform:translate3d(0,-5vh,0) rotate(0)}8%{opacity:.8}30%{transform:translate3d(var(--s1),30vh,0) rotate(calc(var(--rot)*.3))}60%{transform:translate3d(var(--s2),62vh,0) rotate(calc(var(--rot)*.65))}92%{opacity:.6}100%{opacity:0;transform:translate3d(var(--dx),108vh,0) rotate(var(--rot))}}
#pg{position:fixed;top:0;left:0;height:3px;width:100%;transform:scaleX(0);transform-origin:0 50%;background:var(--acento);z-index:30}

/* ===== animaciones de entrada ===== */
.rv{opacity:0;transform:translateY(28px);transition:opacity 1s,transform 1s}
.rv.rl{transform:translateX(-46px)}.rv.rr{transform:translateX(46px)}.rv.rz{transform:scale(.9) rotate(-1.5deg)}
.rv.on{opacity:1;transform:none}
.rv:not(.vis),.rv:not(.vis) *{animation-play-state:paused}
.sp span{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(.45em);transition:opacity .8s,filter .8s,transform .8s;transition-delay:calc(var(--i)*55ms)}
.sp.w span{transition-delay:calc(var(--i)*70ms)}
.sp.on span{opacity:1;filter:none;transform:none}
.orn{margin:76px auto 6px;width:170px;color:var(--acento)}
.orn .ln{fill:none;stroke:currentColor;stroke-width:1;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s .2s}
.orn.on .ln{stroke-dashoffset:0}
.orn .sh{fill:currentColor;stroke:none}
.orn .rg{fill:none;stroke:currentColor;stroke-width:1.6}
.orn .fl{transform-origin:85px 12px;animation:giro 9s linear infinite}
.orn .r1,.orn .r2{transition:transform 1.4s .6s cubic-bezier(.3,1.4,.5,1)}
.orn .r1{transform:translateX(-8px)}.orn .r2{transform:translateX(8px)}
.orn.on .r1,.orn.on .r2{transform:none}
.orn .lat{transform-origin:85px 14px;animation:lat2 1.8s ease-in-out infinite}
@keyframes lat2{50%{transform:scale(1.2)}}
@keyframes giro{to{transform:rotate(360deg)}}

/* ===== portada ===== */
#portada{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 0;position:relative;z-index:2}
#portada h1{font-size:clamp(2.9rem,13.5vw,3.9rem);line-height:1.15;text-shadow:0 1px 0 #fffc,0 6px 14px rgba(var(--sh),.3)}
.fecha{display:flex;align-items:center;justify-content:center;gap:14px;font-size:clamp(1.9rem,9vw,2.7rem);font-weight:600;letter-spacing:.16em;color:var(--cafe);margin:8px 0 8px;opacity:0;animation:ent 1.2s 1.4s forwards;text-shadow:0 1px 0 #fffc,0 4px 10px rgba(var(--sh),.25)}
.fecha:before,.fecha:after{content:"";width:clamp(22px,8vw,48px);height:1px;background:var(--cafe)}
.para{font-style:italic;color:#4a3b2a;min-height:1.4em}
@keyframes ent{to{opacity:1}}
.env{position:relative;width:min(78vw,340px);height:min(58.5vw,255px);cursor:pointer;margin-top:44px;perspective:900px;animation:latido 2.6s ease-in-out infinite}
.env.open{animation:none}
@keyframes latido{50%{transform:scale(1.035)}}
.env .back,.env .front,.env .flap{position:absolute;top:0;right:0;bottom:0;left:0;background:var(--arena)}
.env .back{background:linear-gradient(180deg,#c4ad8e,#8a6d47);box-shadow:0 3px 6px rgba(var(--sh),.25),0 22px 38px rgba(var(--sh),.32)}
.env .front{-webkit-clip-path:polygon(0 100%,0 30%,50% 64%,100% 30%,100% 100%);clip-path:polygon(0 100%,0 30%,50% 64%,100% 30%,100% 100%);z-index:4;background:linear-gradient(160deg,#eadfca,#dcc9ae 55%,#d2bc9d)}
.env .flap{-webkit-clip-path:polygon(0 0,100% 0,50% 64%);clip-path:polygon(0 0,100% 0,50% 64%);background:linear-gradient(180deg,#d6c4a8,#c6b08f);transform-origin:top;transition:transform .9s,z-index 0s .45s;z-index:5}
.env .fotos{position:absolute;left:8%;right:8%;top:10%;bottom:20%;z-index:2;transition:transform 1.3s .5s cubic-bezier(.2,.8,.2,1)}
.env .fotos img{position:absolute;width:52%;border:5px solid #fff;box-shadow:0 4px 12px #0003}
.env .fotos img:nth-child(1){left:0;top:6%;transform:rotate(-7deg)}
.env .fotos img:nth-child(2){right:0;top:0;transform:rotate(5deg)}
.env .flores{position:absolute;z-index:6;width:62%;left:-10%;bottom:-14%;pointer-events:none}
.sello{position:absolute;left:50%;top:62%;width:min(13.3vw,58px);height:min(13.3vw,58px);transform:translate(-50%,-50%);border-radius:50%;z-index:7;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#b08f60,#7a5c36);color:#fffaf0;font-size:clamp(.8rem,4vw,1.15rem);box-shadow:0 3px 8px #0004,inset 0 0 0 3px #ffffff33;transition:transform .7s,opacity .6s}
.env.open .sello{transform:translate(-50%,-50%) scale(1.7) rotate(25deg);opacity:0}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .fotos{transform:translateY(-58%)}
.chis{position:absolute;left:50%;top:40%;width:11px;height:11px;background:var(--acento);-webkit-clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);z-index:8;pointer-events:none;opacity:0;animation:chispa 1.3s ease-out forwards}
@keyframes chispa{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.3) rotate(180deg)}}
.hint{margin-top:56px;font-size:1.7rem;transition:opacity .5s;animation:bob 3s ease-in-out infinite}
.hint small{display:block;font:italic 1rem 'Cormorant Garamond',serif;margin-top:4px}
@keyframes bob{50%{transform:translateY(-5px)}}
.env.open~.hint{opacity:0;animation:none}
.flecha{position:absolute;bottom:18px;opacity:0;font-size:1.6rem;transition:opacity 1s 1.4s}
.env.open~.flecha{opacity:.6;animation:bote 1.6s infinite 2.4s}
@keyframes bote{50%{transform:translateY(8px)}}

/* ===== contenido ===== */
.cita{font-style:italic;font-size:1.3rem;line-height:1.5;margin:30px 0 10px}
.ini{width:170px;margin:16px auto;animation:flota 5s ease-in-out infinite}
.ini-txt{font-size:6rem;line-height:1.2;color:var(--acento);animation:flota 5s ease-in-out infinite}
@keyframes flota{50%{transform:translateY(-7px)}}
.music{margin:40px 0}
.music p{font-size:.95rem;margin-bottom:10px}
.bar{height:2px;background:var(--tinta);margin:0 auto 8px;position:relative;max-width:300px;cursor:pointer}
.bar i{position:absolute;left:0;top:-1px;height:4px;background:var(--acento);width:0}
.music button{background:none;border:0;font-size:1.4rem;cursor:pointer;color:var(--tinta);padding:4px 14px}
#flota{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;border:1px solid #8a6d47;background:#fffdf8e6;font-size:1.1rem;cursor:pointer;display:none;z-index:20;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);color:var(--tinta);box-shadow:0 3px 6px rgba(var(--sh),.25),0 10px 18px rgba(var(--sh),.18)}
#flota.pl{animation:pulso 2s infinite}
.papel{margin:26px 0;filter:drop-shadow(0 2px 3px rgba(var(--sh),.25)) drop-shadow(0 14px 18px rgba(var(--sh),.2))}
.tear{background:var(--papel);padding:44px 24px}
.tear h3{font-size:1.1rem;font-weight:600;margin-bottom:12px}
.cols{display:flex;gap:14px}
.cols div{flex:1;font-size:1.05rem;line-height:1.55}
.tear small{display:block;margin-top:8px;font-style:italic}
.cuenta{display:flex;justify-content:center;gap:6px;color:var(--acento);font-size:2.6rem;margin:14px 0 8px;perspective:400px}
.cuenta div{min-width:58px}.cuenta b{display:block;font-weight:400;text-shadow:0 1px 0 #fffc,0 4px 10px rgba(var(--sh),.3)}
.cuenta .f{animation:flip .5s}
@keyframes flip{from{transform:rotateX(90deg);opacity:0}to{transform:none;opacity:1}}
.cuenta small{display:block;font-size:.62rem;letter-spacing:.1em;color:#5a4a37}
.pol{--r:-2.5deg;position:relative;background:#fffdf9;padding:10px 10px 56px;box-shadow:0 2px 4px rgba(var(--sh),.22),0 16px 32px rgba(var(--sh),.24),0 30px 50px rgba(212,189,154,.25);margin:44px auto;max-width:330px;opacity:0;transform:rotate(var(--r)) translateY(34px) scale(.95);transition:opacity 1.2s,transform 1.2s}
.pol:nth-of-type(even){--r:2.5deg}
.pol.on{opacity:1;transform:rotate(var(--r))}
@media(hover:hover){.pol.on:hover{transform:rotate(0) scale(1.025)}}
.pol:before{content:"";position:absolute;z-index:2;top:-11px;left:50%;width:86px;height:24px;margin-left:-43px;transform:rotate(-3deg);background:rgba(122,94,60,.92);box-shadow:0 2px 4px rgba(var(--sh),.22)}
.pol:nth-of-type(even):before{background:rgba(138,109,71,.92);transform:rotate(4deg)}
.pol:nth-of-type(3n):before{background:rgba(104,78,48,.92)}
.pol .fr{overflow:hidden}
.pol .fr img{width:100%;display:block}
.pol.land{max-width:400px}
.pol .ph{min-height:280px}
.bn img{filter:grayscale(1)}
.it{position:relative;margin:30px auto;max-width:380px}
.it:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:linear-gradient(var(--cafe),var(--trigo));transform-origin:top;transform:scaleY(0);transition:transform 2.4s}
.it.on:before{transform:scaleY(1)}
.ev{display:grid;grid-template-columns:1fr 24px 1fr;align-items:center;gap:8px;margin:30px 0}
.ev .ic{width:70px;margin:auto;order:1;animation:flota 4.5s ease-in-out infinite}
.ev .ic.ph{min-height:56px;width:56px;animation:none}
.ev .dot{order:2;width:10px;height:10px;border-radius:50%;background:var(--cafe);margin:auto;position:relative;box-shadow:0 0 0 4px rgba(212,189,154,.45),0 3px 6px rgba(var(--sh),.35)}
.ev.on .dot:after{content:"";position:absolute;top:-2px;right:-2px;bottom:-2px;left:-2px;border-radius:50%;border:1px solid var(--acento);animation:onda 2.6s infinite}
@keyframes onda{to{transform:scale(3.4);opacity:0}}
.ev .tx{order:3;text-align:left}
.ev:nth-child(even) .ic{order:3}.ev:nth-child(even) .tx{order:1;text-align:right}
.ev b{display:block;font-weight:600}
.btn{position:relative;overflow:hidden;display:inline-block;margin:12px 4px 0;padding:9px 22px;border:1px solid #8a6d47;border-radius:30px;background:var(--papel);color:var(--tinta);text-decoration:none;font:inherit;font-size:1rem;box-shadow:0 2px 4px rgba(var(--sh),.2),0 10px 18px rgba(var(--sh),.16);cursor:pointer;transition:transform .2s,background .2s}
.btn:after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,#fff9,transparent);transform:skewX(-20deg);transition:left .7s}
@media(hover:hover){.btn:hover{transform:translateY(-2px);background:#f3ece0}.btn:hover:after{left:130%}}
.btn.sol{background:var(--acento);color:#fff;border-color:var(--acento);animation:pulso 2.8s infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 #8a6d4788}70%,100%{box-shadow:0 0 0 14px #8a6d4700}}
.lugar{margin:34px 0}
.lugar p{margin:4px 0 12px;line-height:1.5}
.mapa{width:100%;height:240px;border:0;border-radius:6px;filter:grayscale(.55) sepia(.25);box-shadow:0 3px 6px rgba(var(--sh),.2),0 14px 26px rgba(var(--sh),.2)}
.mapa.ph{display:grid;place-items:center;padding:20px;font-style:italic;color:#5a4a37}
.paleta{display:flex;justify-content:center;gap:10px;margin-top:14px}
.paleta i{width:26px;height:26px;border-radius:50%;box-shadow:0 3px 6px rgba(var(--sh),.32),inset 0 0 0 2px #ffffff88;animation:flota 3.5s ease-in-out infinite}
.paleta i:nth-child(2){animation-delay:-.7s}.paleta i:nth-child(3){animation-delay:-1.4s}.paleta i:nth-child(4){animation-delay:-2.1s}
form{text-align:left;margin:22px 0}
label{display:block;margin:14px 0 4px;font-size:.95rem}
input[type=text],input[type=number],textarea{width:100%;padding:10px 12px;border:1px solid #a8905f;border-radius:4px;font:inherit;background:var(--papel);box-shadow:inset 0 1px 3px rgba(var(--sh),.14)}
textarea{min-height:80px;resize:vertical}
.opc{display:flex;gap:10px}
.opc label{flex:1;margin:0}
.opc input{position:absolute;opacity:0}
.opc span{display:block;padding:10px;border:1px solid #a8905f;border-radius:30px;text-align:center;cursor:pointer;transition:.25s;background:var(--papel)}
.opc input:checked+span{box-shadow:0 6px 14px rgba(var(--sh),.3);background:var(--acento);color:#fff;border-color:var(--acento);transform:scale(1.03)}
.opc input:focus-visible+span{outline:2px solid var(--acento);outline-offset:2px}
.gracias{display:none;padding:30px 10px;font-size:1.3rem;font-style:italic}
.fin{margin:50px auto 10px;max-width:340px;padding-bottom:40px}
footer{padding:50px 0 90px;font-style:italic;line-height:1.5}

/* ===== monograma fusionado ===== */
.mono{position:relative;display:flex;justify-content:center;width:max-content;padding:.05em .2em;font-size:150px;line-height:1.2;margin:14px auto;font-family:var(--script)}
.mono.sm{font-size:88px}
.mono b{position:relative;top:.02em;font-weight:400;line-height:1.1;font-size:1em;mix-blend-mode:multiply;opacity:0;filter:blur(9px);text-shadow:0 .03em .06em rgba(var(--sh),.25);transition:transform 1.8s cubic-bezier(.2,.8,.2,1),opacity 1.3s,filter 1.3s}
.mono .a{transform:translateX(-.35em) rotate(-10deg)}
.mono .b{margin-left:-.3em;top:.1em;transform:translateX(.35em) rotate(10deg)}
.mono.on b{opacity:1;filter:none}
.mono.on .a{transform:rotate(-2deg);animation:fa 7s 2.2s ease-in-out infinite}
.mono.on .b{transform:rotate(2deg);animation:fb 7s 2.2s ease-in-out infinite}
@keyframes fa{50%{transform:rotate(-5deg) translateY(-.03em)}}
@keyframes fb{50%{transform:rotate(5deg) translateY(.03em)}}
.aro{position:absolute;top:-4%;right:-8%;bottom:-4%;left:-8%;width:116%;height:108%;overflow:visible;animation:giroL 50s linear infinite}
@keyframes giroL{to{transform:rotate(360deg)}}
.aro ellipse{fill:none;stroke:var(--acento);stroke-width:1;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2.6s .6s}
.aro ellipse.f{stroke:var(--trigo);stroke-width:.6;transition-delay:1.2s}
.mono.on .aro ellipse{stroke-dashoffset:0}
.st{position:absolute;width:12px;height:12px;background:var(--trigo);-webkit-clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:brilla 3.4s ease-in-out infinite}
.st.s1{left:-6%;top:12%}.st.s2{right:-8%;top:34%;animation-delay:-1.2s;background:var(--acento)}.st.s3{left:46%;bottom:-6%;animation-delay:-2.2s;width:9px;height:9px}
@keyframes brilla{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:.95;transform:scale(1) rotate(90deg)}}

/* ===== reproductor con disco ===== */
.music{position:relative}
.disco{position:relative;width:132px;height:132px;border-radius:50%;margin:8px auto 12px;background:repeating-radial-gradient(circle,#7a644c 0 1.5px,#8b7458 2.5px 3.5px);box-shadow:0 3px 6px rgba(var(--sh),.3),0 18px 30px rgba(var(--sh),.3);animation:spin 7s linear infinite;animation-play-state:paused}
.disco:after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;border-radius:50%;background:conic-gradient(from 30deg,transparent 0,#ffffff44 8%,transparent 22%,transparent 50%,#ffffff33 58%,transparent 72%)}
.disco .lab{position:absolute;top:32%;right:32%;bottom:32%;left:32%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c9ad84,#8a6d47);display:grid;place-items:center;color:#fffaf0;font-size:1.15rem;z-index:1;box-shadow:inset 0 0 0 2px #ffffff55,0 1px 3px rgba(0,0,0,.25)}
@keyframes spin{to{transform:rotate(360deg)}}
.pl .disco{animation-play-state:running}
.eq{display:flex;gap:4px;justify-content:center;align-items:flex-end;height:24px;margin-bottom:10px}
.eq i{width:4px;height:5px;border-radius:2px;background:linear-gradient(var(--acento),var(--trigo));animation:eq 1s ease-in-out infinite;animation-play-state:paused}
.eq i:nth-child(2){animation-duration:.75s;animation-delay:-.3s}.eq i:nth-child(3){animation-duration:1.2s;animation-delay:-.6s}.eq i:nth-child(4){animation-duration:.9s;animation-delay:-.2s}.eq i:nth-child(5){animation-duration:1.1s;animation-delay:-.5s}
.pl .eq i{animation-play-state:running}
@keyframes eq{50%{height:24px}}
.bar:before{content:"";position:absolute;top:-12px;right:0;bottom:-12px;left:0}

  if(E.mariposas){
    const cs=[["#e6c9c1","#c99a8e"],["#e6cf99","#bf9d52"],["#c8d2b4","#8c9870"]];
    cs.slice(0,LOW?2:3).forEach((c,i)=>{
      const m=document.createElement("div"),w=R(30,44);m.className="mar";
      m.style.cssText=`width:${w}px;--y:${R(35,78)};animation-duration:${R(26,38)}s;animation-delay:${-R(0,30)+i*2}s`;
      m.innerHTML=`<svg viewBox="0 0 40 30"><g class="al" fill="${c[0]}" stroke="${c[1]}" stroke-width=".7"><path d="M20 15C12 2 2 3 4 12c1 6 8 7 16 3z"/><path d="M20 16C13 20 8 28 14 28c5 0 8-6 6-12z"/><path d="M20 15C28 2 38 3 36 12c-1 6-8 7-16 3z"/><path d="M20 16C27 20 32 28 26 28c-5 0-8-6-6-12z"/></g><path d="M20 8v16" stroke="#6b5640" stroke-width="1.5" stroke-linecap="round"/></svg>`;
      add(m);
    });
  }
}
/* destellos al tocar la pantalla */
addEventListener("pointerdown",e=>{
  if(!E.toque||reduce||document.body.classList.contains("lock")||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  for(let i=0;i<8;i++){
    const t=document.createElement("i"),a=R(0,6.28),d=R(30,70);
    t.className="tq";t.style.cssText=`left:${e.clientX-5}px;top:${e.clientY-5}px;background:${pick(TODOS)};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px`;
    document.body.appendChild(t);setTimeout(()=>t.remove(),1100);
  }
});

/* ===== revelado al hacer scroll ===== */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("on");io.unobserve(e.target)}}),{threshold:.2});
$$(".rv,.sp,.pol,.it,.ev").forEach(n=>{if(n.id!=="portada"&&!n.closest("#portada"))io.observe(n)});
const mo=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.src=e.target.dataset.src;mo.unobserve(e.target)}}),{rootMargin:"300px"});
$$(".mapa[data-src]").forEach(m=>mo.observe(m));

/* si existe assets/iniciales.png se usa en lugar del monograma automático */
const pi=new Image();
pi.onload=()=>$$(".monoBox").forEach(b=>{
  b.innerHTML=`<img class="ini rv rz" src="${C.img.iniciales}" alt="Iniciales" style="${b.dataset.sm?"width:100px":""}">`;
  io.observe($("img",b));
});
pi.src=C.img.iniciales;

/* ===== progreso, fondo y parallax (solo mueve lo visible) ===== */
const fondo=$("#fondo"),pg=$("#pg");
let tk=false;
const vo=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle("vis",e.isIntersecting)),{rootMargin:"80px"});
$$(".rv").forEach(n=>vo.observe(n));
function frame(){
  tk=false;
  const h=document.documentElement.scrollHeight,p=Math.min(1,Math.max(0,scrollY/Math.max(1,h-innerHeight)));
  fondo.style.transform=`translate3d(0,${(-p*70).toFixed(2)}vh,0)`;
  pg.style.transform=`scaleX(${p.toFixed(4)})`;
}
addEventListener("scroll",()=>{if(!tk){tk=true;requestAnimationFrame(frame)}},{passive:true});

/* ===== abrir sobre + sonido ===== */
const env=$("#env"),aud=$("#aud"),amb=$("#amb"),btn=$("#play"),flota=$("#flota"),estado=$("#estado");
aud.src=C.musica;amb.src=C.ambiente;
aud.volume=C.volumen.cancion;amb.volume=0;flota.textContent="♪";
let nI,silencio=false,oculto=false;
function fade(a,to,ms=1400){
  clearInterval(a._f);
  if(!volOK){if(to===0)a.pause();else a.volume=to;return}const from=a.volume,n=ms/40;let k=0;
  a._f=setInterval(()=>{k++;a.volume=Math.max(0,Math.min(1,from+(to-from)*k/n));
    if(k>=n){clearInterval(a._f);if(to===0)a.pause()}},40);
}
const ambIn=()=>amb.play().then(()=>fade(amb,C.volumen.ambiente)).catch(()=>{});
const ambOut=()=>fade(amb,C.volumen.ambienteConCancion||0);
function silenciar(v){silencio=v;aud.muted=v;amb.muted=v;flota.classList.toggle("mute",v)}
function notas(){
  const m=$(".music"),n=document.createElement("span");n.className="mn";n.textContent=pick(["♪","♫","♬","♡"]);
  n.style.cssText=`margin-left:${R(-90,90)}px;--x:${R(-60,60)}px;--r:${R(-40,40)}deg;color:${pick([...PAL.rosa,...PAL.oro,"#8a6d47"])}`;
  m.appendChild(n);setTimeout(()=>n.remove(),3300);
}
function icono(){
  const pl=!aud.paused;
  btn.textContent=pl?"❚❚":"▶";
  $(".music").classList.toggle("pl",pl);
  flota.classList.toggle("pl",pl||!amb.paused);
  if(aud.error)falloAudio({name:"NotSupportedError"});
  else estado.innerHTML=pl?'Reproduciendo<span class="pts"></span>':(aud.currentTime>1?"En pausa":"Toca play para escuchar nuestra canción");
  clearInterval(nI);if(pl&&!reduce)nI=setInterval(notas,650);
}
function chispas(){
  for(let i=0,n=LOW?16:24;i<n;i++){const s=document.createElement("i"),a=Math.random()*6.28,d=100+Math.random()*130;
    s.className="chis";s.style.background=["#8a6d47","#bfa27a","#e6d3b8","#6b5236"][i%4];
    s.style.setProperty("--x",Math.cos(a)*d+"px");s.style.setProperty("--y",Math.sin(a)*d-50+"px");
    s.style.animationDelay=Math.random()*.35+"s";env.appendChild(s);setTimeout(()=>s.remove(),1900)}
}
const wreath=()=>{
  const P=t=>{const u=1-t;return[u*u*u*60+3*u*u*t*28+3*u*t*t*6+t*t*t*10,u*u*u*77+3*u*u*t*74+3*u*t*t*54+t*t*t*20]};
  const D=t=>{const u=1-t;return[3*u*u*(28-60)+6*u*t*(6-28)+3*t*t*(10-6),3*u*u*(74-77)+6*u*t*(54-74)+3*t*t*(20-54)]};
  let h="";
  for(let k=0;k<9;k++){const t=.1+k*.1,[x,y]=P(t),[dx,dy]=D(t),a=Math.atan2(dy,dx)*180/Math.PI;
    for(const o of [-38,38])h+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(a+o).toFixed(0)})"><ellipse class="hb" style="--i:${k}" cx="6" rx="6" ry="2.4" fill="${(k+(o>0?1:0))%2?"#9aa57e":"#b9a15a"}"/></g>`}
  return `<path d="M60 77C28 74 6 54 10 20" fill="none" stroke="#8c7a45" stroke-width="1.6" stroke-linecap="round"/>${h}`;
};
const RINGS=`<svg viewBox="-10 -6 140 90"><defs><linearGradient id="oro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e3ad"/><stop offset=".5" stop-color="#d4aa55"/><stop offset="1" stop-color="#9a7430"/></linearGradient></defs><g><g class="rb">${wreath()}</g></g><g transform="translate(120 0) scale(-1 1)"><g class="rb">${wreath()}</g></g><g class="a1"><circle cx="46" cy="42" r="21" fill="none" stroke="url(#oro)" stroke-width="6"/><path d="M46 9l8 9-8 9-8-9z" fill="#fffdf6" stroke="#d4aa55" stroke-width="1.2"/></g><g class="a2"><circle cx="74" cy="42" r="21" fill="none" stroke="url(#oro)" stroke-width="6"/></g></svg>`;
const PALOMA='<svg viewBox="0 0 64 40"><path class="ala" style="animation-delay:-.2s;opacity:.8" d="M27 19C24 6 13 1 3 3C10 9 17 18 25 25Z" fill="#f3ead8" stroke="#d8c8ab" stroke-width=".6"/><path d="M6 24C12 15 22 14 30 17C34 11 40 9 45 11C43 14 42 16 41 18C48 20 55 24 60 29C51 29 43 27 37 27C29 33 15 32 6 24Z" fill="#fff" stroke="#d8c8ab" stroke-width=".7"/><path d="M45 11L52 13L45.5 14.5Z" fill="#d9b86a"/><circle cx="42.5" cy="13.5" r=".9" fill="#5e4630"/><path class="ala" d="M27 19C23 5 11 0 1 2C9 8 17 18 25 25Z" fill="#fffdf8" stroke="#d8c8ab" stroke-width=".7"/></svg>';
/* al abrir el sobre: destello, lluvia de pétalos de rosa, corazones, anillos y palomas */
function boda(){
  if(reduce||E.boda===false)return;
  const box=$("#boda"),r=env.getBoundingClientRect();
  box.style.setProperty("--cx",(r.left+r.width/2)+"px");box.style.setProperty("--cy",(r.top+r.height*.38)+"px");
  const add=(tag,cls,css,html)=>{const e=document.createElement(tag);e.className=cls;e.style.cssText=css;if(html)e.innerHTML=html;box.appendChild(e)};
  add("i","flash","");
  const cols=["#f8efe2","#f1dcd2","#e8c6ba","#f3e4c6","#dba99d","#fffaf0","#ecd0c4"];
  for(let i=0,n=Math.round(48*(LOW?.6:1));i<n;i++){
    const w=R(11,22);
    add("i","rosa",`width:${w}px;height:${w*R(1,1.3)}px;background:${pick(cols)};--x:${R(-170,170)}px;--y:${R(-280,-70)}px;--fx:${R(-130,130)}px;--r1:${R(-200,200)}deg;--r2:${R(-500,500)}deg;--d:${R(3.4,5.6)}s;--de:${R(0,.7)}s`);
  }
  for(let i=0;i<10;i++)add("span","hc",`font-size:${R(14,28)}px;color:${pick([...PAL.rosa,...PAL.oro])};--x:${R(-140,140)}px;--d:${R(2.8,4.2)}s;--de:${R(.2,1.2)}s`,"♥");
  add("div","anillos","",RINGS);
  add("div","paloma","--w:112px;--x0:-28vw;--x1:125vw;--y0:68vh;--y1:12vh;--d:7s;--de:1s",PALOMA);
  add("div","paloma inv","--w:84px;--x0:125vw;--x1:-28vw;--y0:56vh;--y1:16vh;--d:8s;--de:1.9s",PALOMA);
  setTimeout(()=>{box.innerHTML=""},11000);
}
function abrir(){
  if(env.classList.contains("open"))return;
  env.classList.add("open");
  $("#marco").classList.add("v");
  $("#contenido").style.display="block";
  flota.style.display="block";
  if(!reduce)chispas();
  boda();
  vida();
  ambIn();                       /* la música ambiente arranca sola; la canción solo con PLAY */
  setTimeout(()=>{document.documentElement.classList.remove("lock");document.body.classList.remove("lock");$("#contenido").scrollIntoView({behavior:"smooth"})},3400);
}
env.onclick=abrir;
env.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();abrir()}};

/* reproductor */
function aviso(t){estado.innerHTML='<span class="nota">'+t+'</span>'}
function falloAudio(err){
  if(err&&err.name==="NotAllowedError")aviso("Tu navegador bloqueó el sonido. Toca play otra vez.");
  else aviso("No se pudo cargar la canción. Revisa que exista assets/"+C.musica.split("/").pop()+" y que el nombre esté en minúsculas.");
}
aud.onerror=()=>falloAudio({name:"NotSupportedError"});
btn.onclick=()=>{
  if(aud.paused){
    if(silencio)silenciar(false);
    if(aud.error)aud.load();
    const p=aud.play();if(p&&p.catch)p.catch(falloAudio);
  }else aud.pause();
};
aud.onplay=()=>{ambOut();icono()};
aud.onpause=()=>{if(!oculto&&!aud.ended)ambIn();icono()};
aud.onended=()=>{aud.currentTime=0;ambIn();icono()};
flota.onclick=()=>silenciar(!silencio);
$("#atras").onclick=()=>{aud.currentTime=Math.max(0,aud.currentTime-10)};
$("#adelante").onclick=()=>{if(aud.duration)aud.currentTime=Math.min(aud.duration-.5,aud.currentTime+10)};
$("#vol").oninput=e=>{aud.volume=+e.target.value};
if(!volOK)$(".vol").style.display="none";
const fm=t=>isFinite(t)?Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0"):"0:00";
aud.ontimeupdate=aud.onloadedmetadata=()=>{
  $("#prog").style.width=(aud.currentTime/(aud.duration||1)*100)+"%";
  $("#tiempo").textContent=fm(aud.currentTime)+" / "+fm(aud.duration);
};
$("#bar").onclick=e=>{const b=e.currentTarget.getBoundingClientRect();if(aud.duration)aud.currentTime=(e.clientX-b.left)/b.width*aud.duration};
let eraC=false,eraA=false;
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){oculto=true;eraC=!aud.paused;eraA=!amb.paused;aud.pause();amb.pause()}
  else{oculto=false;if(eraC)aud.play().catch(()=>{});else if(eraA)ambIn();eraC=eraA=false}
});

/* disco con tu imagen (assets/disco.jpg) */
if(C.disco&&C.disco.imagen){
  const di=new Image();
  di.onload=()=>{const d=$(".disco");d.style.setProperty("--dimg",`url("${C.disco.imagen}")`);d.classList.add("foto",C.disco.modo==="etiqueta"?"etiq":"comp")};
  di.src=C.disco.imagen;
}

/* precarga de fotos cuando el navegador está libre */
/* el marco polaroid se adapta a la foto: las horizontales salen más anchas */
const marcar=i=>{const p=i.closest(".pol");if(p&&i.naturalWidth>i.naturalHeight*1.12)p.classList.add("land")};
document.addEventListener("load",e=>{if(e.target.tagName==="IMG")marcar(e.target)},true);
$$(".pol img").forEach(i=>{if(i.complete&&i.naturalWidth)marcar(i)});
const precarga=()=>[...C.img.galeria].forEach(u=>{const i=new Image();i.decoding="async";i.src=u});
window.requestIdleCallback?requestIdleCallback(precarga,{timeout:3000}):setTimeout(precarga,1500);

/* ===== cuenta regresiva con efecto giro ===== */
const meta=new Date(C.fecha).getTime(),cu=$("#cuenta");
cu.innerHTML=["DÍAS","HORAS","MINUTOS","SEGUNDOS"].map(l=>`<div><b>00</b><small>${l}</small></div>`).join("");
const celdas=$$("b",cu);
function tick(){
  const d=Math.max(0,meta-Date.now()),p=n=>String(n).padStart(2,"0");
  [Math.floor(d/864e5),Math.floor(d%864e5/36e5),Math.floor(d%36e5/6e4),Math.floor(d%6e4/1e3)].forEach((x,i)=>{
    const t=p(x);if(celdas[i].textContent!==t){celdas[i].textContent=t;celdas[i].classList.remove("f");void celdas[i].offsetWidth;celdas[i].classList.add("f")}});
}
tick();setInterval(tick,1000);

/* ===== calendario (.ics) ===== */
$("#cal").onclick=()=>{
  const p2=n=>String(n).padStart(2,"0"),f=d=>d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+"T"+p2(d.getHours())+p2(d.getMinutes())+"00";
  const ini=new Date(C.fecha),fin=new Date(+ini+C.duracionHoras*36e5),lg=C.lugares.find(l=>dirOk(l.direccion));
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","BEGIN:VEVENT","SUMMARY:Boda "+C.nombres,"DTSTART:"+f(ini),"DTEND:"+f(fin),lg?"LOCATION:"+lg.direccion:"","END:VEVENT","END:VCALENDAR"].filter(Boolean).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));a.download="boda.ics";a.click();
};

/* ===== confirmación de asistencia ===== */
$$('input[name=va]').forEach(r=>r.onchange=()=>$("#npbox").style.display=r.value==="si"?"block":"none");
$("#form").onsubmit=async e=>{
  e.preventDefault();
  const nom=$("#nom").value.trim();
  if(!nom){$("#nom").focus();$("#nom").style.borderColor="#b33";return}
  const va=$('input[name=va]:checked').value==="si",
        np=va?Math.min(pases,Math.max(1,parseInt($("#np").value)||1)):0,msg=$("#msg").value.trim();
  const texto=`Hola! Soy ${nom}. ${va?`Confirmo mi asistencia a la boda de ${C.nombres} (${np} ${np>1?"personas":"persona"}).`:`Lamentablemente no podré asistir a la boda de ${C.nombres}.`}${msg?" Mensaje: "+msg:""}`;
  if(C.asistencia.endpoint){
    try{await fetch(C.asistencia.endpoint,{method:"POST",mode:"no-cors",body:JSON.stringify({nombre:nom,asiste:va?"Sí":"No",personas:np,mensaje:msg,fecha:new Date().toLocaleString()})})}catch(_){}
  }
  $("#form").style.display="none";$("#gracias").style.display="block";
  $("#gracias").scrollIntoView({behavior:"smooth",block:"center"});
  if(/^\d{8,15}$/.test(C.asistencia.whatsapp))setTimeout(()=>window.open(`https://wa.me/${C.asistencia.whatsapp}?text=${enc(texto)}`,"_blank"),900);
};
