<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sergio & Yasuani · 24.02.2027</title>
<meta name="description" content="Estás invitado a nuestra boda">
<meta property="og:title" content="Sergio & Yasuani · Nuestra boda">
<meta property="og:description" content="Toca el sobre para abrir tu invitación">
<meta property="og:image" content="assets/portada.jpg">
<meta name="theme-color" content="#faf6ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--acento:#b09676;--arena:#d9c7ad;--tinta:#2b241d;--gris:#ece5d8;--crema:#faf6ef;--papel:#fffdf8;--trigo:#d4bd9a;--cafe:#8a7156;--sh:122,94,60}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--crema);color:var(--tinta);font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;text-align:center;overflow-x:hidden}
body.lock{overflow:hidden;height:100svh}
.wrap{max-width:480px;margin:0 auto;padding:0 22px;position:relative;z-index:2}
.script{font-family:'Pinyon Script',cursive;font-weight:400}
h2.script{font-size:3.1rem;line-height:1.1;margin:8px 0 18px;text-shadow:0 1px 0 #fffc,0 5px 12px rgba(var(--sh),.28)}
img{max-width:100%;display:block}
.ph{background:var(--gris);min-height:140px;border:1px dashed #cdbfa8}
:focus-visible{outline:2px solid var(--acento);outline-offset:3px}
.nota{font-style:italic;color:#9a8466;border-bottom:1px dashed #c9b697}

/* ===== fondo con detalle ===== */
#fondo{position:fixed;inset:0;z-index:-2;background-image:radial-gradient(circle at 8% 6%,#f1e5d1 0,transparent 30%),radial-gradient(circle at 96% 30%,#efe0c6 0,transparent 32%),radial-gradient(circle at 6% 62%,#f4eadb 0,transparent 30%),radial-gradient(circle at 92% 78%,#e9d8bd 0,transparent 30%),radial-gradient(circle at 20% 98%,#ecdfc8 0,transparent 32%),radial-gradient(circle at 60% 50%,#f7efe0 0,transparent 40%);background-size:100% 170%;background-position:0 calc(var(--p,0)*100%)}
#grano{position:fixed;inset:0;z-index:-1;opacity:.38;pointer-events:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .36 0 0 0 0 .25 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#marco{position:fixed;inset:10px;border:1px solid #b0967666;outline:1px solid #b0967638;outline-offset:-6px;pointer-events:none;z-index:15;opacity:0;transition:opacity 1.5s 1s}
body:not(.lock) #marco,#marco.v{opacity:1}
.rama{filter:drop-shadow(0 4px 6px rgba(var(--sh),.25));position:fixed;top:14vh;width:54px;height:62vh;opacity:.3;z-index:1;pointer-events:none;transform-origin:50% 100%;animation:sway 8s ease-in-out infinite}
.rama.i{left:-16px}.rama.d{right:-16px;--f:-1;animation-delay:-4s}
@keyframes sway{0%,100%{transform:scaleX(var(--f,1)) rotate(-2.5deg)}50%{transform:scaleX(var(--f,1)) rotate(2.5deg)}}
#petalos{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.pet{box-shadow:0 2px 4px rgba(var(--sh),.22);position:absolute;top:-30px;border-radius:100% 0 100% 0;opacity:0;animation:caer linear infinite}
@keyframes caer{0%{opacity:0;transform:translate3d(0,-5vh,0) rotate(0)}8%{opacity:.8}30%{transform:translate3d(var(--s1),30vh,0) rotate(calc(var(--rot)*.3))}60%{transform:translate3d(var(--s2),62vh,0) rotate(calc(var(--rot)*.65))}92%{opacity:.6}100%{opacity:0;transform:translate3d(var(--dx),108vh,0) rotate(var(--rot))}}
#pg{position:fixed;top:0;left:0;height:3px;width:0;background:var(--acento);z-index:30}

/* ===== animaciones de entrada ===== */
.rv{opacity:0;transform:translateY(28px);transition:opacity 1s,transform 1s}
.rv.rl{transform:translateX(-46px)}.rv.rr{transform:translateX(46px)}.rv.rz{transform:scale(.9) rotate(-1.5deg)}
.rv.on{opacity:1;transform:none}
.sp span{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(.45em);transition:opacity .8s,filter .8s,transform .8s;transition-delay:calc(var(--i)*55ms)}
.sp.w span{transition-delay:calc(var(--i)*70ms)}
.sp.on span{opacity:1;filter:none;transform:none}
.orn{margin:76px auto 6px;width:170px}
.orn path{fill:none;stroke:var(--acento);stroke-width:1;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s .2s}
.orn.on path{stroke-dashoffset:0}
.orn .fl{fill:var(--acento);stroke:none;transform-origin:85px 10px;animation:giro 9s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}

/* ===== portada ===== */
#portada{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 0;position:relative;z-index:2}
#portada h1{font-size:clamp(2.6rem,12vw,3.4rem);line-height:1.15;text-shadow:0 1px 0 #fffc,0 6px 14px rgba(var(--sh),.3)}
.fecha{letter-spacing:.14em;margin:6px 0 4px;opacity:0;animation:ent 1.2s 1.4s forwards}
.para{font-style:italic;color:#6b5d4a;min-height:1.4em}
@keyframes ent{to{opacity:1}}
.env{position:relative;width:min(78vw,340px);aspect-ratio:4/3;cursor:pointer;margin-top:44px;perspective:900px;animation:latido 2.6s ease-in-out infinite}
.env.open{animation:none}
@keyframes latido{50%{transform:scale(1.035)}}
.env .back,.env .front,.env .flap{position:absolute;inset:0;background:var(--arena)}
.env .back{background:linear-gradient(180deg,#c4ad8e,#b09676);box-shadow:0 3px 6px rgba(var(--sh),.25),0 22px 38px rgba(var(--sh),.32)}
.env .front{clip-path:polygon(0 100%,0 30%,50% 64%,100% 30%,100% 100%);z-index:4;background:linear-gradient(160deg,#eadfca,#dcc9ae 55%,#d2bc9d)}
.env .flap{clip-path:polygon(0 0,100% 0,50% 64%);background:linear-gradient(180deg,#d6c4a8,#c6b08f);transform-origin:top;transition:transform .9s,z-index 0s .45s;z-index:5}
.env .fotos{position:absolute;left:8%;right:8%;top:10%;bottom:20%;z-index:2;transition:transform 1.3s .5s cubic-bezier(.2,.8,.2,1)}
.env .fotos img{position:absolute;width:52%;border:5px solid #fff;box-shadow:0 4px 12px #0003}
.env .fotos img:nth-child(1){left:0;top:6%;transform:rotate(-7deg)}
.env .fotos img:nth-child(2){right:0;top:0;transform:rotate(5deg)}
.env .flores{position:absolute;z-index:6;width:62%;left:-10%;bottom:-14%;pointer-events:none}
.sello{position:absolute;left:50%;top:62%;width:17%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:7;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#c9ae8b,#9c8261);color:#fffaf0;font-size:clamp(.8rem,4vw,1.15rem);box-shadow:0 3px 8px #0004,inset 0 0 0 3px #ffffff33;transition:transform .7s,opacity .6s}
.env.open .sello{transform:translate(-50%,-50%) scale(1.7) rotate(25deg);opacity:0}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .fotos{transform:translateY(-58%)}
.chis{position:absolute;left:50%;top:40%;width:11px;height:11px;background:var(--acento);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);z-index:8;pointer-events:none;opacity:0;animation:chispa 1.3s ease-out forwards}
@keyframes chispa{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.3) rotate(180deg)}}
.hint{margin-top:56px;font-size:1.7rem;transition:opacity .5s;animation:bob 3s ease-in-out infinite}
.hint small{display:block;font:italic 1rem 'Cormorant Garamond',serif;margin-top:4px}
@keyframes bob{50%{transform:translateY(-5px)}}
.env.open~.hint{opacity:0;animation:none}
.flecha{position:absolute;bottom:18px;opacity:0;font-size:1.6rem;transition:opacity 1s 1.4s}
.env.open~.flecha{opacity:.6;animation:bote 1.6s infinite 2.4s}
@keyframes bote{50%{transform:translateY(8px)}}

/* ===== contenido ===== */
.cita{font-style:italic;font-size:1.3rem;line-height:1.5;margin:30px 0 10px}
.ini{width:170px;margin:16px auto;animation:flota 5s ease-in-out infinite}
.ini-txt{font-size:6rem;line-height:1.2;color:var(--acento);animation:flota 5s ease-in-out infinite}
@keyframes flota{50%{transform:translateY(-7px)}}
.music{margin:40px 0}
.music p{font-size:.95rem;margin-bottom:10px}
.bar{height:2px;background:var(--tinta);margin:0 auto 8px;position:relative;max-width:300px;cursor:pointer}
.bar i{position:absolute;left:0;top:-1px;height:4px;background:var(--acento);width:0}
.music button{background:none;border:0;font-size:1.4rem;cursor:pointer;color:var(--tinta);padding:4px 14px}
#flota{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;border:1px solid #bba98c;background:#fffdf8e6;font-size:1.1rem;cursor:pointer;display:none;z-index:20;backdrop-filter:blur(4px);color:var(--tinta);box-shadow:0 3px 6px rgba(var(--sh),.25),0 10px 18px rgba(var(--sh),.18)}
#flota.pl{animation:pulso 2s infinite}
.papel{margin:26px 0;filter:drop-shadow(0 2px 3px rgba(var(--sh),.25)) drop-shadow(0 14px 18px rgba(var(--sh),.2))}
.tear{background:var(--papel);padding:44px 24px}
.tear h3{font-size:1.1rem;font-weight:600;margin-bottom:12px}
.cols{display:flex;gap:14px}
.cols div{flex:1;font-size:1.05rem;line-height:1.55}
.tear small{display:block;margin-top:8px;font-style:italic}
.cuenta{display:flex;justify-content:center;gap:6px;color:var(--acento);font-size:2.6rem;margin:14px 0 8px;perspective:400px}
.cuenta div{min-width:58px}.cuenta b{display:block;font-weight:400;text-shadow:0 1px 0 #fffc,0 4px 10px rgba(var(--sh),.3)}
.cuenta .f{animation:flip .5s}
@keyframes flip{from{transform:rotateX(90deg);opacity:0}to{transform:none;opacity:1}}
.cuenta small{display:block;font-size:.62rem;letter-spacing:.1em;color:#7a6c58}
.pol{--r:-2.5deg;position:relative;background:#fffdf9;padding:10px 10px 56px;box-shadow:0 2px 4px rgba(var(--sh),.22),0 16px 32px rgba(var(--sh),.24),0 30px 50px rgba(212,189,154,.25);margin:44px auto;max-width:330px;opacity:0;transform:rotate(var(--r)) translateY(34px) scale(.95);transition:opacity 1.2s,transform 1.2s}
.pol:nth-of-type(even){--r:2.5deg}
.pol.on{opacity:1;transform:rotate(var(--r))}
.pol.on:hover{transform:rotate(0) scale(1.025)}
.pol:before{content:"";position:absolute;z-index:2;top:-11px;left:50%;width:86px;height:24px;margin-left:-43px;transform:rotate(-3deg);background:rgba(217,199,173,.8);box-shadow:0 2px 4px rgba(var(--sh),.22)}
.pol:nth-of-type(even):before{background:rgba(232,216,192,.85);transform:rotate(4deg)}
.pol:nth-of-type(3n):before{background:rgba(206,184,150,.78)}
.pol .fr{overflow:hidden}
.pol .fr img{width:100%;transform:scale(1.15)}
.bn img{filter:grayscale(1)}
.it{position:relative;margin:30px auto;max-width:380px}
.it:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:linear-gradient(var(--cafe),var(--trigo));transform-origin:top;transform:scaleY(0);transition:transform 2.4s}
.it.on:before{transform:scaleY(1)}
.ev{display:grid;grid-template-columns:1fr 24px 1fr;align-items:center;gap:8px;margin:30px 0}
.ev .ic{width:70px;margin:auto;order:1;animation:flota 4.5s ease-in-out infinite}
.ev .ic.ph{min-height:56px;width:56px;animation:none}
.ev .dot{order:2;width:10px;height:10px;border-radius:50%;background:var(--cafe);margin:auto;position:relative;box-shadow:0 0 0 4px rgba(212,189,154,.45),0 3px 6px rgba(var(--sh),.35)}
.ev.on .dot:after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1px solid var(--acento);animation:onda 2.6s infinite}
@keyframes onda{to{transform:scale(3.4);opacity:0}}
.ev .tx{order:3;text-align:left}
.ev:nth-child(even) .ic{order:3}.ev:nth-child(even) .tx{order:1;text-align:right}
.ev b{display:block;font-weight:600}
.btn{position:relative;overflow:hidden;display:inline-block;margin:12px 4px 0;padding:9px 22px;border:1px solid #a89578;border-radius:30px;background:var(--papel);color:var(--tinta);text-decoration:none;font:inherit;font-size:1rem;box-shadow:0 2px 4px rgba(var(--sh),.2),0 10px 18px rgba(var(--sh),.16);cursor:pointer;transition:transform .2s,background .2s}
.btn:after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,#fff9,transparent);transform:skewX(-20deg);transition:left .7s}
.btn:hover{transform:translateY(-2px);background:#f3ece0}.btn:hover:after{left:130%}
.btn.sol{background:var(--acento);color:#fff;border-color:var(--acento);animation:pulso 2.8s infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 #b0967688}70%,100%{box-shadow:0 0 0 14px #b0967600}}
.lugar{margin:34px 0}
.lugar p{margin:4px 0 12px;line-height:1.5}
.mapa{width:100%;height:240px;border:0;border-radius:6px;filter:grayscale(.55) sepia(.25);box-shadow:0 3px 6px rgba(var(--sh),.2),0 14px 26px rgba(var(--sh),.2)}
.mapa.ph{display:grid;place-items:center;padding:20px;font-style:italic;color:#8a7a62}
.paleta{display:flex;justify-content:center;gap:10px;margin-top:14px}
.paleta i{width:26px;height:26px;border-radius:50%;box-shadow:0 3px 6px rgba(var(--sh),.32),inset 0 0 0 2px #ffffff88;animation:flota 3.5s ease-in-out infinite}
.paleta i:nth-child(2){animation-delay:-.7s}.paleta i:nth-child(3){animation-delay:-1.4s}.paleta i:nth-child(4){animation-delay:-2.1s}
form{text-align:left;margin:22px 0}
label{display:block;margin:14px 0 4px;font-size:.95rem}
input[type=text],input[type=number],textarea{width:100%;padding:10px 12px;border:1px solid #c4b498;border-radius:4px;font:inherit;background:var(--papel);box-shadow:inset 0 1px 3px rgba(var(--sh),.14)}
textarea{min-height:80px;resize:vertical}
.opc{display:flex;gap:10px}
.opc label{flex:1;margin:0}
.opc input{position:absolute;opacity:0}
.opc span{display:block;padding:10px;border:1px solid #c4b498;border-radius:30px;text-align:center;cursor:pointer;transition:.25s;background:var(--papel)}
.opc input:checked+span{box-shadow:0 6px 14px rgba(var(--sh),.3);background:var(--acento);color:#fff;border-color:var(--acento);transform:scale(1.03)}
.opc input:focus-visible+span{outline:2px solid var(--acento);outline-offset:2px}
.gracias{display:none;padding:30px 10px;font-size:1.3rem;font-style:italic}
.fin{margin:50px auto 10px;max-width:340px;padding-bottom:40px}
footer{padding:50px 0 90px;font-style:italic;line-height:1.5}

/* ===== monograma fusionado ===== */
.mono{position:relative;font-size:150px;width:1.12em;height:1.15em;margin:14px auto;font-family:'Pinyon Script',cursive}
.mono.sm{font-size:88px}
.mono b{position:absolute;top:.02em;font-weight:400;line-height:1.1;font-size:1em;mix-blend-mode:multiply;opacity:0;filter:blur(9px);text-shadow:0 .03em .06em rgba(var(--sh),.25);transition:transform 1.8s cubic-bezier(.2,.8,.2,1),opacity 1.3s,filter 1.3s}
.mono .a{left:0;transform:translateX(-.35em) rotate(-10deg)}
.mono .b{right:0;top:.1em;transform:translateX(.35em) rotate(10deg)}
.mono.on b{opacity:1;filter:none}
.mono.on .a{transform:rotate(-2deg);animation:fa 7s 2.2s ease-in-out infinite}
.mono.on .b{transform:rotate(2deg);animation:fb 7s 2.2s ease-in-out infinite}
@keyframes fa{50%{transform:rotate(-5deg) translateY(-.03em)}}
@keyframes fb{50%{transform:rotate(5deg) translateY(.03em)}}
.aro{position:absolute;inset:-4% -8%;width:116%;height:108%;overflow:visible;animation:giroL 50s linear infinite}
@keyframes giroL{to{transform:rotate(360deg)}}
.aro ellipse{fill:none;stroke:var(--acento);stroke-width:1;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2.6s .6s}
.aro ellipse.f{stroke:var(--trigo);stroke-width:.6;transition-delay:1.2s}
.mono.on .aro ellipse{stroke-dashoffset:0}
.st{position:absolute;width:12px;height:12px;background:var(--trigo);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:brilla 3.4s ease-in-out infinite}
.st.s1{left:-6%;top:12%}.st.s2{right:-8%;top:34%;animation-delay:-1.2s;background:var(--acento)}.st.s3{left:46%;bottom:-6%;animation-delay:-2.2s;width:9px;height:9px}
@keyframes brilla{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:.95;transform:scale(1) rotate(90deg)}}

/* ===== reproductor con disco ===== */
.music{position:relative}
.disco{position:relative;width:132px;height:132px;border-radius:50%;margin:8px auto 12px;background:repeating-radial-gradient(circle,#7a644c 0 1.5px,#8b7458 2.5px 3.5px);box-shadow:0 3px 6px rgba(var(--sh),.3),0 18px 30px rgba(var(--sh),.3);animation:spin 7s linear infinite;animation-play-state:paused}
.disco:after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent 0,#ffffff44 8%,transparent 22%,transparent 50%,#ffffff33 58%,transparent 72%)}
.disco .lab{position:absolute;inset:32%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ecdcc2,#c6ad88);display:grid;place-items:center;color:#fffaf0;font-size:1.15rem;z-index:1;box-shadow:inset 0 0 0 2px #ffffff55,0 1px 3px rgba(0,0,0,.25)}
@keyframes spin{to{transform:rotate(360deg)}}
.pl .disco{animation-play-state:running}
.eq{display:flex;gap:4px;justify-content:center;align-items:flex-end;height:24px;margin-bottom:10px}
.eq i{width:4px;height:5px;border-radius:2px;background:linear-gradient(var(--acento),var(--trigo));animation:eq 1s ease-in-out infinite;animation-play-state:paused}
.eq i:nth-child(2){animation-duration:.75s;animation-delay:-.3s}.eq i:nth-child(3){animation-duration:1.2s;animation-delay:-.6s}.eq i:nth-child(4){animation-duration:.9s;animation-delay:-.2s}.eq i:nth-child(5){animation-duration:1.1s;animation-delay:-.5s}
.pl .eq i{animation-play-state:running}
@keyframes eq{50%{height:24px}}
.bar:before{content:"";position:absolute;inset:-12px 0}
.bar i u{position:absolute;right:-5px;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--acento);box-shadow:0 0 0 4px rgba(176,150,118,.3),0 2px 4px rgba(var(--sh),.4)}
.tm{font-size:.85rem;color:#7a6c58;letter-spacing:.06em}
.mn{position:absolute;left:50%;top:70px;pointer-events:none;color:var(--acento);font-size:1.3rem;opacity:0;text-shadow:0 2px 4px rgba(var(--sh),.25);animation:nota 3.2s ease-out forwards}
@keyframes nota{0%{opacity:0;transform:translate(0,0) rotate(0)}20%{opacity:.95}100%{opacity:0;transform:translate(var(--x),-100px) rotate(var(--r))}}

/* ===== reproductor: tarjeta, disco editable y brazo ===== */
.tarjeta{position:relative;margin:14px auto 0;max-width:340px;padding:30px 20px 22px;border-radius:22px;background:linear-gradient(165deg,#fffdf8,#f3e8d4 70%,#ead9bd);box-shadow:0 2px 4px rgba(var(--sh),.2),0 18px 34px rgba(var(--sh),.25);overflow:hidden}
.tarjeta:before{content:"";position:absolute;inset:6px;border:1px solid rgba(176,150,118,.35);border-radius:17px;pointer-events:none}
.plato{position:relative;width:210px;height:160px;margin:0 auto 14px}
.plato .disco{position:absolute;left:14px;top:4px;width:150px;height:150px;margin:0}
.disco:before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 2px,rgba(70,50,30,.16) 2.5px 3px);z-index:1;pointer-events:none}
.disco.comp{background:var(--dimg) center/cover}
.disco.comp .lab,.disco.etiq .lab{font-size:0}
.disco.comp .lab{background:none;box-shadow:none}
.disco.etiq .lab{inset:26%;background:var(--dimg) center/cover;box-shadow:0 0 0 3px #ffffffaa,0 1px 4px rgba(0,0,0,.3)}
.disco.foto .lab:after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--crema);box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.halo{position:absolute;left:-2px;top:-12px;width:178px;height:178px;border-radius:50%;background:radial-gradient(circle,rgba(230,207,153,.6),transparent 68%);opacity:0;transition:opacity 1s}
.pl .halo{opacity:1;animation:halo 2.2s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.12)}}
.anillo{position:absolute;left:-4px;top:-8px;width:170px;height:170px;border:1px dashed var(--trigo);border-radius:50%;animation:giroL 28s linear infinite;opacity:.8}
.brazo{position:absolute;right:6px;top:6px;width:12px;height:112px;transform-origin:6px 6px;transform:rotate(-14deg);transition:transform 1.1s cubic-bezier(.3,.8,.3,1);z-index:3;filter:drop-shadow(2px 4px 3px rgba(var(--sh),.35))}
.brazo:before{content:"";position:absolute;left:-7px;top:-7px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ecdcc2,#a98f6c)}
.brazo i{position:absolute;left:3px;top:10px;width:6px;height:96px;border-radius:3px;background:linear-gradient(90deg,#d8c4a4,#a98f6c)}
.brazo i:after{content:"";position:absolute;left:-3px;bottom:-6px;width:12px;height:14px;border-radius:3px;background:#8a7156}
.pl .brazo{transform:rotate(22deg)}
.pista{margin:4px 0 8px}
.pista b{display:block;font-size:1.25rem;font-weight:600}
.pista span{font-style:italic;color:#6b5d4a}
.ctl{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:8px}
.ctl button{width:42px;height:42px;border-radius:50%;border:1px solid #c9b697;background:var(--papel);box-shadow:0 2px 4px rgba(var(--sh),.22),0 8px 14px rgba(var(--sh),.14);font:inherit;font-size:.8rem;color:var(--tinta);cursor:pointer;padding:0;transition:transform .2s}
.ctl button:hover{transform:translateY(-2px) scale(1.05)}
.ctl .grande{width:62px;height:62px;font-size:1.3rem;background:linear-gradient(160deg,#cdb592,#b09676);color:#fff;border:0;animation:pulso 2.8s infinite}
.pl .ctl .grande{animation:pulso 1.5s infinite}
.vol{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;color:var(--cafe)}
.vol input{width:120px;accent-color:var(--acento)}
.pts:after{content:"";animation:pts 1.4s steps(1) infinite}
@keyframes pts{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
#flota.mute:after{content:"";position:absolute;left:9px;right:9px;top:50%;height:2px;background:var(--cafe);transform:rotate(-45deg);border-radius:2px}
.mn{top:150px}

/* ===== vida en el fondo ===== */
.sube{top:auto;bottom:-70px;animation-name:subir}
@keyframes subir{0%{opacity:0;transform:translate3d(0,0,0) scale(.6)}12%{opacity:.75}85%{opacity:.5}100%{opacity:0;transform:translate3d(var(--dx),-115vh,0) scale(1.15) rotate(var(--rot))}}
.cor{background:none!important;box-shadow:none!important;border-radius:0!important;line-height:1;text-shadow:0 2px 4px rgba(var(--sh),.25)}
.bok{background:radial-gradient(circle,rgba(255,238,205,.85),rgba(255,238,205,0) 70%)!important;box-shadow:none!important;border-radius:50%!important;filter:blur(1px)}
.bri{position:absolute;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;animation:brilla ease-in-out infinite}
.mar{position:absolute;top:0;left:0;animation:vuela linear infinite;filter:drop-shadow(0 4px 4px rgba(var(--sh),.25))}
.mar svg{width:100%;display:block}
.al{transform-origin:20px 15px;animation:ale .32s ease-in-out infinite alternate}
@keyframes ale{to{transform:scaleX(.2)}}
@keyframes vuela{0%{transform:translate(-14vw,calc(var(--y)*1vh)) rotate(12deg)}20%{transform:translate(18vw,calc(var(--y)*1vh - 18vh)) rotate(-14deg)}45%{transform:translate(46vw,calc(var(--y)*1vh + 4vh)) rotate(10deg)}70%{transform:translate(74vw,calc(var(--y)*1vh - 22vh)) rotate(-12deg)}100%{transform:translate(118vw,calc(var(--y)*1vh - 6vh)) rotate(8deg)}}
.tq{position:fixed;width:11px;height:11px;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);pointer-events:none;z-index:40;animation:chispa 1s ease-out forwards}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.rv,.pol{opacity:1;transform:none}.mono b{opacity:1;filter:none;transform:none}.aro ellipse{stroke-dashoffset:0}.mn{display:none}.sp span{opacity:1;filter:none;transform:none}.it:before{transform:none}.orn path{stroke-dashoffset:0}.fecha{opacity:1}#petalos{display:none}}
</style>
</head>
<body class="lock">
<div id="fondo"></div><div id="grano"></div><div id="marco"></div><div id="pg"></div><div id="petalos"></div>
<main id="app"></main>
<button id="flota" aria-label="Música">♪</button>
<audio id="aud" preload="metadata"></audio>
<audio id="amb" loop preload="auto"></audio>

<script>
/* ================= PERSONALIZA AQUÍ =================
   Todo lo que diga "Colocar ..." es un dato que debes reemplazar.
   Guía completa en LEEME.md. Archivos en la carpeta "assets". */
const C = {
  nombres: "Sergio & Yasuani",
  fecha: "2027-02-24T10:00:00",               // fecha y hora de la ceremonia
  fechaTexto: "24.02.2027",
  paseDefecto: 2,                             // pases si el link no trae ?pases=
  cita: "El amor nos encontró, el destino nos unió y hoy queremos compartir contigo el día más especial de nuestras vidas.",
  musica: "assets/cancion.mp3",               // canción principal: solo suena cuando el invitado toca PLAY
  ambiente: "assets/ambiente.mp3",            // música de fondo suave: suena sola al abrir el sobre
  volumen: {ambiente:.35, cancion:.85, ambienteConCancion:0},   // 0 a 1. ambienteConCancion: volumen del ambiente mientras suena la canción (0 = se apaga)
  cancion: {titulo:"Colocar nombre de la canción", artista:"Colocar artista"},
  /* Disco que gira: pon assets/disco.jpg (foto cuadrada) para personalizarlo.
     modo "completo": la foto cubre todo el disco · modo "etiqueta": la foto solo va en el centro */
  disco: {imagen:"assets/disco.jpg", modo:"completo"},
  tituloMusica: "Dale play para escuchar nuestra canción fav",

  /* efectos de fondo: pon false para quitar alguno */
  efectos: {hojas:true, corazones:true, brillos:true, mariposas:true, toque:true, ramas:true, marco:true, grano:true},

  img: {
    flores: "assets/flores.png",
    iniciales: "assets/iniciales.png",
    sobreFotos: ["assets/sobre1.jpg","assets/sobre2.jpg"],
    galeria: ["assets/foto1.jpg","assets/foto2.jpg","assets/foto3.jpg","assets/foto4.jpg"],
    final: "assets/final.jpg"
  },
  /* Monograma: las 2 letras se fusionan automáticamente. Si pones assets/iniciales.png se usa tu imagen en su lugar */
  monograma: {a:"S", b:"Y", color1:"#b09676", color2:"#8a7156"},
  blancoYNegro: true,

  padres: [
    {titulo:"Con la bendición de Dios y nuestros padres",
     cols:[["Padres del novio","Colocar nombre de la madre","Colocar nombre del padre"],
           ["Padres de la novia","Colocar nombre de la madre","Colocar nombre del padre"]]},
    {titulo:"Y nuestros Padrinos:",
     cols:[["Padrinos de Ramo","Colocar nombre de la madrina","Colocar nombre del padrino"],
           ["Padrinos de Anillos","Colocar nombre de la madrina","Colocar nombre del padrino"]]}
  ],

  /* Con una dirección real se genera el mapa y los botones de Google Maps y Waze */
  lugares: [
    {titulo:"Ceremonia", nombre:"Colocar nombre del lugar", detalle:"Colocar hora", direccion:"Colocar dirección completa"},
    {titulo:"Recepción", nombre:"Colocar nombre del lugar", detalle:"Colocar hora", direccion:"Colocar dirección completa"}
  ],
  duracionHoras: 8,                           // para "Agregar al calendario"

  itinerario: [
    {hora:"Colocar hora", txt:"Ceremonia", icono:"assets/ic-ceremonia.png"},
    {hora:"Colocar hora", txt:"Photocall", icono:"assets/ic-foto.png"},
    {hora:"Colocar hora", txt:"Cocktail",  icono:"assets/ic-cocktail.png"},
    {hora:"Colocar hora", txt:"Comida",    icono:"assets/ic-comida.png"},
    {hora:"Colocar hora", txt:"Tarta",     icono:"assets/ic-tarta.png"},
    {hora:"Colocar hora", txt:"Fiesta",    icono:"assets/ic-fiesta.png"}
  ],

  dress: {tipo:"Formal", l1:"Mujeres: Vestido largo", l2:"Hombres: Trajes", nota:"Evitar colores blancos y parecidos",
          paleta:["#f3ead9","#e3d2b8","#cdb591","#b09676","#8a7156"]},

  asistencia: {
    texto: "Agradecemos confirmar tu asistencia antes del",
    limite: "Colocar fecha límite",
    whatsapp: "",                             // Colocar número de WhatsApp con código de país (ej. 5215512345678)
    endpoint: ""                              // Opcional: URL de Google Apps Script (ver LEEME.md)
  },
  cierre: "Será un honor contar con tu presencia en este día tan significativo para nosotros. Celebraremos el amor, la unión y los nuevos comienzos."
};
/* ================= FIN ================= */

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nt=t=>/^colocar/i.test(t)?`<span class="nota">${esc(t)}</span>`:esc(t);
const im=(src,cls="",alt="")=>`<img src="${src}" class="${cls}" alt="${alt}" loading="lazy" onerror="this.classList.add('ph');this.removeAttribute('src')">`;
const enc=encodeURIComponent;
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const dirOk=d=>d&&!/^colocar/i.test(d);
const M=C.monograma;
const mono=sm=>`<div class="mono rv${sm?" sm":""}" role="img" aria-label="Monograma ${esc(M.a)} ${esc(M.b)}"><svg class="aro" viewBox="0 0 200 180" aria-hidden="true"><ellipse pathLength="1" cx="100" cy="90" rx="95" ry="83"/><ellipse class="f" pathLength="1" cx="100" cy="90" rx="88" ry="76"/></svg><b class="a" style="color:${M.color1}">${esc(M.a)}</b><b class="b" style="color:${M.color2}">${esc(M.b)}</b><i class="st s1"></i><i class="st s2"></i><i class="st s3"></i></div>`;

const q=new URLSearchParams(location.search);
const invitado=(q.get("invitado")||"").trim().slice(0,60);
const pases=Math.min(20,Math.max(1,parseInt(q.get("pases"))||C.paseDefecto));

const orn=()=>`<div class="orn rv"><svg viewBox="0 0 170 20" width="170"><path pathLength="1" d="M0 10H66"/><path pathLength="1" d="M104 10H170"/><g class="fl"><path d="M85 1c4 4 4 14 0 18-4-4-4-14 0-18zM76 10c4-4 14-4 18 0-4 4-14 4-18 0z" fill-opacity=".9"/></g></svg></div>`;
const H=(t,id="")=>`${orn()}<h2 class="script" data-sp ${id?`id="${id}"`:""}>${t}</h2>`;
const pol=(g)=>`<div class="pol"><div class="fr">${im(g)}</div></div>`;

const padres=C.padres.map(p=>`<div class="papel rv rz"><div class="tear"><h3>${p.titulo}</h3>
  <div class="cols">${p.cols.map(c=>`<div><b>${c[0]}</b><br>${c.slice(1).map(nt).join("<br>")}</div>`).join("")}</div></div></div>`).join("");

const lugares=C.lugares.map(l=>{const ok=dirOk(l.direccion);return `<div class="lugar rv">
  <h3 class="script" style="font-size:2.1rem;font-weight:400">${l.titulo}</h3>
  <p><b>${nt(l.nombre)}</b><br>${nt(l.detalle)} · ${nt(l.direccion)}</p>
  ${ok?`<iframe class="mapa" data-src="https://maps.google.com/maps?q=${enc(l.direccion)}&output=embed" title="Mapa ${l.titulo}"></iframe><br>
  <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${enc(l.direccion)}">Google Maps</a>
  <a class="btn" target="_blank" rel="noopener" href="https://waze.com/ul?q=${enc(l.direccion)}&navigate=yes">Waze</a>`
  :`<div class="mapa ph">El mapa aparecerá aquí al colocar la dirección</div>`}</div>`}).join("");

$("#app").innerHTML=`
<section id="portada">
  <h1 class="script" data-sp>${C.nombres}</h1>
  <p class="fecha">${C.fechaTexto}</p>
  <p class="para">${invitado?"Invitación para "+esc(invitado):""}</p>
  <div class="env" id="env" role="button" tabindex="0" aria-label="Abrir invitación">
    <div class="back"></div>
    <div class="fotos">${C.img.sobreFotos.map(s=>im(s)).join("")}</div>
    <div class="flap"></div><div class="front"></div>
    <div class="sello script">${esc(M.a)}${esc(M.b)}</div>
    <img class="flores" src="${C.img.flores}" alt="" onerror="this.remove()">
  </div>
  <p class="hint script">Toca el sobre para abrir<small>Pase para (${pases}) ${pases>1?"personas":"persona"}</small></p>
  <div class="flecha">⌄</div>
</section>

<div class="wrap" id="contenido" style="display:none">
  <p class="cita" data-sp="w">“${C.cita}”</p>
  <div class="monoBox">${mono()}</div>

  <div class="music rv">
    <p>${C.tituloMusica}</p>
    <div class="tarjeta">
      <div class="plato">
        <i class="halo"></i><i class="anillo"></i>
        <div class="disco"><div class="lab script">${esc(M.a)}${esc(M.b)}</div></div>
        <div class="brazo" aria-hidden="true"><i></i></div>
      </div>
      <div class="pista"><b>${nt(C.cancion.titulo)}</b><span>${nt(C.cancion.artista)}</span></div>
      <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="bar" id="bar"><i id="prog"><u></u></i></div>
      <small class="tm" id="tiempo">0:00 / 0:00</small>
      <div class="ctl">
        <button id="atras" aria-label="Retroceder 10 segundos">↺10</button>
        <button id="play" class="grande" aria-label="Reproducir o pausar">▶</button>
        <button id="adelante" aria-label="Adelantar 10 segundos">10↻</button>
      </div>
      <div class="vol"><span>♪</span><input type="range" id="vol" min="0" max="1" step=".05" value="${C.volumen.cancion}" aria-label="Volumen"></div>
      <small class="tm" id="estado" style="display:block;margin-top:10px">Toca play para escuchar nuestra canción</small>
    </div>
  </div>

  ${padres}

  ${H("Prepárate!")}
  <p class="rv">Solo faltan...</p>
  <div class="cuenta rv" id="cuenta"></div>
  <p class="rv">Para nuestro gran día!</p>

  <div class="${C.blancoYNegro?"bn":""}">${C.img.galeria.slice(0,2).map(pol).join("")}</div>

  ${H("Itinerario")}
  <div class="it" id="it">${C.itinerario.map((e,i)=>`<div class="ev rv ${i%2?"rr":"rl"}">${im(e.icono,"ic")}<span class="dot"></span><div class="tx"><b>${nt(e.hora)}</b>${esc(e.txt)}</div></div>`).join("")}</div>

  <div class="${C.blancoYNegro?"bn":""}">${C.img.galeria.slice(2).map(pol).join("")}</div>

  ${H("¿Dónde?")}
  ${lugares}
  <button class="btn rv" id="cal">Agregar al calendario</button>

  ${H("Dress code")}
  <div class="papel rv rz"><div class="tear"><h3>${C.dress.tipo}</h3>${C.dress.l1}<br>${C.dress.l2}<small>${C.dress.nota}</small>
    ${C.dress.paleta.length?`<div class="paleta">${C.dress.paleta.map(c=>`<i style="background:${c}"></i>`).join("")}</div>`:""}</div></div>

  ${H("Asistencia","rsvp")}
  <p class="rv">${C.asistencia.texto} ${nt(C.asistencia.limite)}</p>
  <form id="form" class="rv" novalidate>
    <label for="nom">Tu nombre</label>
    <input type="text" id="nom" required maxlength="60" value="${esc(invitado)}" autocomplete="name">
    <label>¿Nos acompañas?</label>
    <div class="opc">
      <label><input type="radio" name="va" value="si" checked><span>Sí, ahí estaré</span></label>
      <label><input type="radio" name="va" value="no"><span>No podré asistir</span></label>
    </div>
    <div id="npbox"><label for="np">Personas que asistirán (máx. ${pases})</label>
    <input type="number" id="np" min="1" max="${pases}" value="${pases}"></div>
    <label for="msg">Mensaje para los novios (opcional)</label>
    <textarea id="msg" maxlength="300"></textarea>
    <div style="text-align:center"><button class="btn sol" type="submit">Confirmar asistencia</button></div>
  </form>
  <div class="gracias" id="gracias">¡Gracias por confirmar! Nos hace muy felices contar contigo.</div>

  <div class="pol fin ${C.blancoYNegro?"bn":""}"><div class="fr">${im(C.img.final)}</div></div>
  <div class="monoBox" data-sm="1">${mono(true)}</div>
  <footer class="rv">“${C.cierre}”</footer>
</div>`;

/* ===== texto que aparece letra por letra / palabra por palabra ===== */
$$("[data-sp]").forEach(el=>{
  const w=el.dataset.sp==="w",t=el.textContent;el.textContent="";el.classList.add("sp");if(w)el.classList.add("w");
  el.setAttribute("aria-label",t);
  (w?t.split(" "):[...t]).forEach((x,i,a)=>{
    const s=document.createElement("span");s.textContent=x===" "?"\u00a0":x;s.style.setProperty("--i",i);s.setAttribute("aria-hidden","true");el.appendChild(s);
    if(w&&i<a.length-1)el.appendChild(document.createTextNode(" "));
  });
});
setTimeout(()=>$("#portada h1").classList.add("on"),250);

/* ===== papel rasgado, cada tarjeta con su tono de beige ===== */
const tintes=[["#fffdf8","#f6eddc"],["#fbf3e4","#f1e4cd"],["#f9f1e1","#efe0c6"]];
$$(".tear").forEach((el,k)=>{
  const n=30,r=()=>(Math.random()*2.6).toFixed(1),t=tintes[k%3];
  const top=Array.from({length:n},(_,i)=>`${(i/(n-1)*100).toFixed(1)}% ${r()}%`);
  const bot=Array.from({length:n},(_,i)=>`${(100-i/(n-1)*100).toFixed(1)}% ${(100-r()).toFixed(1)}%`);
  el.style.clipPath=`polygon(${top.join(",")},${bot.join(",")})`;
  el.style.background=`linear-gradient(165deg,${t[0]},${t[1]})`;
});

/* ===== fondo: ramas, grano, marco, pétalos ===== */
const E=C.efectos;
if(!E.grano)$("#grano").remove();
if(!E.marco)$("#marco").remove();
if(E.ramas){
  let hojas="";const tn=["#b09676","#c9b08c","#d4bd9a","#9c8261","#bfa585"];for(let i=0;i<10;i++){const y=280-i*27;hojas+=`<ellipse fill="${tn[i%5]}" cx="22" cy="${y}" rx="11" ry="4.5" transform="rotate(-32 22 ${y})"/><ellipse fill="${tn[(i+2)%5]}" cx="38" cy="${y-12}" rx="11" ry="4.5" transform="rotate(32 38 ${y-12})"/>`}
  const svg=`<svg viewBox="0 0 60 300" preserveAspectRatio="none"><g fill="#b09676"><path d="M30 300C27 200 34 100 30 6" stroke="#b09676" stroke-width="1.4" fill="none"/>${hojas}</g></svg>`;
  document.body.insertAdjacentHTML("beforeend",`<div class="rama i">${svg}</div><div class="rama d">${svg}</div>`);
}
const R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const PAL={
  beige:["#eadbc4","#f3e8d6","#dcc6a7","#e6d3b8","#d4bd9a","#cfb590"],
  salvia:["#b7c3a1","#a3b38d","#c8d2b4"],
  rosa:["#e6c9c1","#dcb5ab","#efd6cf"],
  oro:["#e6cf99","#d8b974","#f0dfb6"],
  terracota:["#d1a58d","#c4917a"],
  oliva:["#9aa57e","#8c9870"]
};
const TODOS=[...PAL.beige,...PAL.beige,...PAL.salvia,...PAL.rosa,...PAL.oro,...PAL.terracota,...PAL.oliva];
function vida(){
  if(reduce)return;
  const box=$("#petalos"),add=el=>box.appendChild(el);
  if(E.hojas)for(let i=0;i<36;i++){
    const p=document.createElement("i"),w=R(9,19),c1=pick(TODOS),c2=pick(TODOS);
    p.className="pet";
    p.style.cssText=`left:${R(0,100)}%;width:${w}px;height:${w*R(1.2,1.7)}px;background:linear-gradient(135deg,${c1},${c2});border-radius:${pick(["100% 0 100% 0","0 100% 0 100%","60% 0 60% 0","100% 0 40% 0"])};animation-duration:${R(13,26)}s;animation-delay:${-R(0,24)}s;--dx:${R(-90,90)}px;--s1:${R(-70,70)}px;--s2:${R(-70,70)}px;--rot:${R(-540,540)}deg`;
    add(p);
  }
  if(E.corazones)for(let i=0;i<9;i++){
    const p=document.createElement("span");p.className="pet cor sube";p.textContent=pick(["♥","♥","✿"]);
    p.style.cssText=`left:${R(4,96)}%;font-size:${R(10,18)}px;color:${pick([...PAL.rosa,...PAL.oro,...PAL.beige])};animation-duration:${R(20,34)}s;animation-delay:${-R(0,30)}s;--dx:${R(-60,60)}px;--rot:${R(-40,40)}deg`;
    add(p);
  }
  if(E.brillos){
    for(let i=0;i<18;i++){
      const p=document.createElement("i"),w=R(7,15);p.className="bri";
      p.style.cssText=`left:${R(2,98)}%;top:${R(2,96)}%;width:${w}px;height:${w}px;background:${pick([...PAL.oro,...PAL.beige,"#fffaf0"])};animation-duration:${R(2.6,6)}s;animation-delay:${-R(0,6)}s`;
      add(p);
    }
    for(let i=0;i<9;i++){
      const p=document.createElement("i"),w=R(24,70);p.className="pet bok sube";
      p.style.cssText=`left:${R(0,100)}%;width:${w}px;height:${w}px;animation-duration:${R(24,42)}s;animation-delay:${-R(0,36)}s;--dx:${R(-40,40)}px;--rot:0deg`;
      add(p);
    }
  }
  if(E.mariposas){
    const cs=[["#e6c9c1","#c99a8e"],["#e6cf99","#bf9d52"],["#c8d2b4","#8c9870"]];
    cs.forEach((c,i)=>{
      const m=document.createElement("div"),w=R(30,44);m.className="mar";
      m.style.cssText=`width:${w}px;--y:${R(35,78)};animation-duration:${R(26,38)}s;animation-delay:${-R(0,30)+i*2}s`;
      m.innerHTML=`<svg viewBox="0 0 40 30"><g class="al" fill="${c[0]}" stroke="${c[1]}" stroke-width=".7"><path d="M20 15C12 2 2 3 4 12c1 6 8 7 16 3z"/><path d="M20 16C13 20 8 28 14 28c5 0 8-6 6-12z"/><path d="M20 15C28 2 38 3 36 12c-1 6-8 7-16 3z"/><path d="M20 16C27 20 32 28 26 28c-5 0-8-6-6-12z"/></g><path d="M20 8v16" stroke="#6b5640" stroke-width="1.5" stroke-linecap="round"/></svg>`;
      add(m);
    });
  }
}
/* destellos al tocar la pantalla */
addEventListener("pointerdown",e=>{
  if(!E.toque||reduce||document.body.classList.contains("lock")||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  for(let i=0;i<8;i++){
    const t=document.createElement("i"),a=R(0,6.28),d=R(30,70);
    t.className="tq";t.style.cssText=`left:${e.clientX-5}px;top:${e.clientY-5}px;background:${pick(TODOS)};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px`;
    document.body.appendChild(t);setTimeout(()=>t.remove(),1100);
  }
});

/* ===== revelado al hacer scroll ===== */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("on");io.unobserve(e.target)}}),{threshold:.2});
$$(".rv,.sp,.pol,.it,.ev").forEach(n=>{if(n.id!=="portada"&&!n.closest("#portada"))io.observe(n)});
const mo=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.src=e.target.dataset.src;mo.unobserve(e.target)}}),{rootMargin:"300px"});
$$(".mapa[data-src]").forEach(m=>mo.observe(m));

/* si existe assets/iniciales.png se usa en lugar del monograma automático */
const pi=new Image();
pi.onload=()=>$$(".monoBox").forEach(b=>{
  b.innerHTML=`<img class="ini rv rz" src="${C.img.iniciales}" alt="Iniciales" style="${b.dataset.sm?"width:100px":""}">`;
  io.observe($("img",b));
});
pi.src=C.img.iniciales;

/* ===== barra de progreso y parallax de fotos ===== */
let tk=false;
addEventListener("scroll",()=>{if(tk)return;tk=true;requestAnimationFrame(()=>{
  tk=false;const h=document.documentElement;
  $("#fondo").style.setProperty("--p",(scrollY/Math.max(1,h.scrollHeight-innerHeight)).toFixed(3));
  $("#pg").style.width=(scrollY/Math.max(1,h.scrollHeight-innerHeight)*100)+"%";
  if(reduce)return;
  $$(".pol .fr img").forEach(i=>{const r=i.parentNode.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;
    i.style.transform=`translateY(${((r.top+r.height/2-innerHeight/2)*-.07).toFixed(1)}px) scale(1.15)`});
})},{passive:true});

/* ===== abrir sobre + sonido ===== */
const env=$("#env"),aud=$("#aud"),amb=$("#amb"),btn=$("#play"),flota=$("#flota"),estado=$("#estado");
aud.src=C.musica;amb.src=C.ambiente;
aud.volume=C.volumen.cancion;amb.volume=0;flota.textContent="♪";
let nI,silencio=false,oculto=false;
function fade(a,to,ms=1400){
  clearInterval(a._f);const from=a.volume,n=ms/40;let k=0;
  a._f=setInterval(()=>{k++;a.volume=Math.max(0,Math.min(1,from+(to-from)*k/n));
    if(k>=n){clearInterval(a._f);if(to===0)a.pause()}},40);
}
const ambIn=()=>amb.play().then(()=>fade(amb,C.volumen.ambiente)).catch(()=>{});
const ambOut=()=>fade(amb,C.volumen.ambienteConCancion||0);
function silenciar(v){silencio=v;aud.muted=v;amb.muted=v;flota.classList.toggle("mute",v)}
function notas(){
  const m=$(".music"),n=document.createElement("span");n.className="mn";n.textContent=pick(["♪","♫","♬","♡"]);
  n.style.cssText=`margin-left:${R(-90,90)}px;--x:${R(-60,60)}px;--r:${R(-40,40)}deg;color:${pick([...PAL.rosa,...PAL.oro,"#b09676"])}`;
  m.appendChild(n);setTimeout(()=>n.remove(),3300);
}
function icono(){
  const pl=!aud.paused;
  btn.textContent=pl?"❚❚":"▶";
  $(".music").classList.toggle("pl",pl);
  flota.classList.toggle("pl",pl||!amb.paused);
  estado.innerHTML=pl?'Reproduciendo<span class="pts"></span>':(aud.currentTime>1?"En pausa":"Toca play para escuchar nuestra canción");
  clearInterval(nI);if(pl&&!reduce)nI=setInterval(notas,650);
}
function chispas(){
  for(let i=0;i<24;i++){const s=document.createElement("i"),a=Math.random()*6.28,d=100+Math.random()*130;
    s.className="chis";s.style.background=["#b09676","#d4bd9a","#e6d3b8","#8a7156"][i%4];
    s.style.setProperty("--x",Math.cos(a)*d+"px");s.style.setProperty("--y",Math.sin(a)*d-50+"px");
    s.style.animationDelay=Math.random()*.35+"s";env.appendChild(s);setTimeout(()=>s.remove(),1900)}
}
function abrir(){
  if(env.classList.contains("open"))return;
  env.classList.add("open");
  $("#marco").classList.add("v");
  $("#contenido").style.display="block";
  flota.style.display="block";
  if(!reduce)chispas();
  vida();
  ambIn();                       /* la música ambiente arranca sola; la canción solo con PLAY */
  setTimeout(()=>{document.body.classList.remove("lock");$("#contenido").scrollIntoView({behavior:"smooth"})},2400);
}
env.onclick=abrir;
env.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();abrir()}};

/* reproductor */
btn.onclick=()=>{
  if(aud.paused){if(silencio)silenciar(false);aud.play().catch(()=>{})}else aud.pause();
};
aud.onplay=()=>{ambOut();icono()};
aud.onpause=()=>{if(!oculto&&!aud.ended)ambIn();icono()};
aud.onended=()=>{aud.currentTime=0;ambIn();icono()};
flota.onclick=()=>silenciar(!silencio);
$("#atras").onclick=()=>{aud.currentTime=Math.max(0,aud.currentTime-10)};
$("#adelante").onclick=()=>{if(aud.duration)aud.currentTime=Math.min(aud.duration-.5,aud.currentTime+10)};
$("#vol").oninput=e=>{aud.volume=+e.target.value};
const fm=t=>isFinite(t)?Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0"):"0:00";
aud.ontimeupdate=aud.onloadedmetadata=()=>{
  $("#prog").style.width=(aud.currentTime/(aud.duration||1)*100)+"%";
  $("#tiempo").textContent=fm(aud.currentTime)+" / "+fm(aud.duration);
};
$("#bar").onclick=e=>{const b=e.currentTarget.getBoundingClientRect();if(aud.duration)aud.currentTime=(e.clientX-b.left)/b.width*aud.duration};
let eraC=false,eraA=false;
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){oculto=true;eraC=!aud.paused;eraA=!amb.paused;aud.pause();amb.pause()}
  else{oculto=false;if(eraC)aud.play().catch(()=>{});else if(eraA)ambIn();eraC=eraA=false}
});

/* disco con tu imagen (assets/disco.jpg) */
if(C.disco&&C.disco.imagen){
  const di=new Image();
  di.onload=()=>{const d=$(".disco");d.style.setProperty("--dimg",`url("${C.disco.imagen}")`);d.classList.add("foto",C.disco.modo==="etiqueta"?"etiq":"comp")};
  di.src=C.disco.imagen;
}

/* ===== cuenta regresiva con efecto giro ===== */
const meta=new Date(C.fecha).getTime(),cu=$("#cuenta");
cu.innerHTML=["DÍAS","HORAS","MINUTOS","SEGUNDOS"].map(l=>`<div><b>00</b><small>${l}</small></div>`).join("");
const celdas=$$("b",cu);
function tick(){
  const d=Math.max(0,meta-Date.now()),p=n=>String(n).padStart(2,"0");
  [Math.floor(d/864e5),Math.floor(d%864e5/36e5),Math.floor(d%36e5/6e4),Math.floor(d%6e4/1e3)].forEach((x,i)=>{
    const t=p(x);if(celdas[i].textContent!==t){celdas[i].textContent=t;celdas[i].classList.remove("f");void celdas[i].offsetWidth;celdas[i].classList.add("f")}});
}
tick();setInterval(tick,1000);

/* ===== calendario (.ics) ===== */
$("#cal").onclick=()=>{
  const p2=n=>String(n).padStart(2,"0"),f=d=>d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+"T"+p2(d.getHours())+p2(d.getMinutes())+"00";
  const ini=new Date(C.fecha),fin=new Date(+ini+C.duracionHoras*36e5),lg=C.lugares.find(l=>dirOk(l.direccion));
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","BEGIN:VEVENT","SUMMARY:Boda "+C.nombres,"DTSTART:"+f(ini),"DTEND:"+f(fin),lg?"LOCATION:"+lg.direccion:"","END:VEVENT","END:VCALENDAR"].filter(Boolean).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));a.download="boda.ics";a.click();
};

/* ===== confirmación de asistencia ===== */
$$('input[name=va]').forEach(r=>r.onchange=()=>$("#npbox").style.display=r.value==="si"?"block":"none");
$("#form").onsubmit=async e=>{
  e.preventDefault();
  const nom=$("#nom").value.trim();
  if(!nom){$("#nom").focus();$("#nom").style.borderColor="#b33";return}
  const va=$('input[name=va]:checked').value==="si",
        np=va?Math.min(pases,Math.max(1,parseInt($("#np").value)||1)):0,msg=$("#msg").value.trim();
  const texto=`Hola! Soy ${nom}. ${va?`Confirmo mi asistencia a la boda de ${C.nombres} (${np} ${np>1?"personas":"persona"}).`:`Lamentablemente no podré asistir a la boda de ${C.nombres}.`}${msg?" Mensaje: "+msg:""}`;
  if(C.asistencia.endpoint){
    try{await fetch(C.asistencia.endpoint,{method:"POST",mode:"no-cors",body:JSON.stringify({nombre:nom,asiste:va?"Sí":"No",personas:np,mensaje:msg,fecha:new Date().toLocaleString()})})}catch(_){}
  }
  $("#form").style.display="none";$("#gracias").style.display="block";
  $("#gracias").scrollIntoView({behavior:"smooth",block:"center"});
  if(/^\d{8,15}$/.test(C.asistencia.whatsapp))setTimeout(()=>window.open(`https://wa.me/${C.asistencia.whatsapp}?text=${enc(texto)}`,"_blank"),900);
};
</script>
</body>
